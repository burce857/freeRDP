name: RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure-rdp:
    runs-on: windows-2019
    timeout-minutes: 3600

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore Backup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Users\Public\Restore" | Out-Null

          if (Test-Path ".\rdp-backup.zip") {
              Expand-Archive ".\rdp-backup.zip" "C:\Users\Public\Restore" -Force
              Write-Host "Backup restored."
          } else {
              Write-Host "No previous backup found."
          }

      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Documents" | Out-Null

          Copy-Item "C:\Users\Public\Restore\*" "C:\Users\RDP\Desktop" -Recurse -Force -ErrorAction SilentlyContinue

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          Start-Sleep -Seconds 10

          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: RDP Info And Hourly Save
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "RDP Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "===================================="

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for ($i = 1; $i -le 6; $i++) {
              Write-Host "[$(Get-Date)] RDP running... Backup round $i"

              if (Test-Path ".\rdp-backup.zip") {
                  Remove-Item ".\rdp-backup.zip" -Force
              }

              Compress-Archive `
                -Path "C:\Users\RDP\Desktop", "C:\Users\RDP\Downloads", "C:\Users\RDP\Documents" `
                -DestinationPath ".\rdp-backup.zip" `
                -Force

              git add rdp-backup.zip

              $status = git status --porcelain

              if ($status) {
                  git commit -m "Hourly RDP backup $i"

                  if ($LASTEXITCODE -eq 0) {
                      git push origin main

                      if ($LASTEXITCODE -eq 0) {
                          Write-Host "Backup uploaded successfully."
                      } else {
                          Write-Host "Git push failed."
                      }
                  } else {
                      Write-Host "Git commit failed."
                  }
              } else {
                  Write-Host "No changes to commit."
              }

              Start-Sleep -Seconds 3600
          }
